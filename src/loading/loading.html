<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #fafafa;
    color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    body {
      background: #09090b;
      color: #e4e4e7;
    }
    .spinner {
      border-color: #27272a;
      border-top-color: #3b82f6;
    }
  }
  body.dark {
    background: #09090b;
    color: #e4e4e7;
  }
  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid #e8e8e8;
    border-top-color: #2563eb;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  body.dark .spinner {
    border-color: #27272a;
    border-top-color: #3b82f6;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p {
    font-size: 15px;
    color: #888;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
</style>
</head>
<body>
  <div class="spinner"></div>
  <p>Fetching content from Jina Reader…</p>
</body>
</html>
