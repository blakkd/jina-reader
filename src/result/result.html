<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 800px;
    margin: 0 auto;
    padding: 24px;
    line-height: 1.7;
    font-size: 15px;
    transition: color 0.2s, background-color 0.2s;
  }
  #content {
    white-space: pre-wrap;
  }
  h1 { font-size: 24px; margin-bottom: 16px; }
  pre { padding: 12px; border-radius: 6px; overflow-x: auto; }
  code { font-size: 13px; }
  img { max-width: 100%; }
  [data-theme="light"] {
    color: #1a1a1a;
    background: #fff;
  }
  [data-theme="light"] pre { background: #f5f5f5; }
  [data-theme="light"] a { color: #2563eb; }
  [data-theme="dark"] {
    color: #e4e4e7;
    background: #09090b;
  }
  [data-theme="dark"] pre { background: #18181b; }
  [data-theme="dark"] a { color: #60a5fa; }
</style>
</head>
<body>
<div id="content"></div>
<script src="result.js"></script>
</body>
</html>
